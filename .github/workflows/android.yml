name: Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Verify signing configuration
        env:
          AFYAREPORT_KEYSTORE_BASE64: ${{ secrets.AFYAREPORT_KEYSTORE_BASE64 }}
          AFYAREPORT_KEYSTORE_PASSWORD: ${{ secrets.AFYAREPORT_KEYSTORE_PASSWORD }}
          AFYAREPORT_KEY_ALIAS: ${{ secrets.AFYAREPORT_KEY_ALIAS }}
          AFYAREPORT_KEY_PASSWORD: ${{ secrets.AFYAREPORT_KEY_PASSWORD }}
        run: |
          test -n "$AFYAREPORT_KEYSTORE_BASE64" || (echo "Missing AFYAREPORT_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$AFYAREPORT_KEYSTORE_PASSWORD" || (echo "Missing AFYAREPORT_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$AFYAREPORT_KEY_ALIAS" || (echo "Missing AFYAREPORT_KEY_ALIAS secret" && exit 1)
          test -n "$AFYAREPORT_KEY_PASSWORD" || (echo "Missing AFYAREPORT_KEY_PASSWORD secret" && exit 1)

      - name: Prepare signing keystore
        env:
          AFYAREPORT_KEYSTORE_BASE64: ${{ secrets.AFYAREPORT_KEYSTORE_BASE64 }}
          AFYAREPORT_KEYSTORE_PASSWORD: ${{ secrets.AFYAREPORT_KEYSTORE_PASSWORD }}
          AFYAREPORT_KEY_ALIAS: ${{ secrets.AFYAREPORT_KEY_ALIAS }}
          AFYAREPORT_KEY_PASSWORD: ${{ secrets.AFYAREPORT_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/afyareport-release.jks"
          printf '%s' "$AFYAREPORT_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "AFYAREPORT_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "AFYAREPORT_KEYSTORE_PASSWORD=$AFYAREPORT_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AFYAREPORT_KEY_ALIAS=$AFYAREPORT_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AFYAREPORT_KEY_PASSWORD=$AFYAREPORT_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew --no-daemon --stacktrace -PVERSION_CODE="$GITHUB_RUN_NUMBER" :app:assembleRelease

      - name: Upload application artifact
        uses: actions/upload-artifact@v6
        with:
          name: AfyaReport
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
